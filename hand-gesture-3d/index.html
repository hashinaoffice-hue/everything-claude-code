<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>옥문강 - Prison Realm</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #0a0a0a;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    #three-canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    #camera-feed {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 240px;
      height: 180px;
      border-radius: 8px;
      border: 2px solid rgba(255, 50, 50, 0.4);
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 10;
    }
    #hand-overlay {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 240px;
      height: 180px;
      border-radius: 8px;
      z-index: 11;
      pointer-events: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 100;
    }
    #loading h2 {
      font-size: 1.5rem;
      margin-bottom: 12px;
      color: #cc3333;
    }
    #loading .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(204, 51, 51, 0.3);
      border-top-color: #cc3333;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #hud {
      position: absolute;
      top: 16px;
      left: 16px;
      font-size: 14px;
      z-index: 10;
      opacity: 0.7;
    }
    #hud .gesture-state {
      padding: 4px 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      margin-bottom: 4px;
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <canvas id="three-canvas"></canvas>
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="hand-overlay"></canvas>
    <div id="hud">
      <div class="gesture-state" id="fps-display">FPS: --</div>
      <div class="gesture-state" id="gesture-display">Gesture: None</div>
    </div>
    <div id="loading">
      <h2>獄門疆</h2>
      <div class="spinner"></div>
      <p style="margin-top: 12px; opacity: 0.6;">Loading...</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
