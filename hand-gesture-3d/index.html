<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0088cc" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="옥문강" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="icon-192.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="icon-192.svg" />
  <title>옥문강 - Prison Realm</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
      font-family: 'Segoe UI', sans-serif;
      color: #fff;
      touch-action: none;
    }
    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }
    /* Full-screen camera background */
    #camera-feed {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform: scaleX(-1);
      z-index: 0;
    }
    /* Three.js canvas overlays on camera */
    #three-canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }
    /* Hand skeleton overlay */
    #hand-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 2;
      pointer-events: none;
    }
    #loading {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      z-index: 100;
    }
    #loading h2 {
      font-size: 1.8rem;
      margin-bottom: 16px;
      color: #0088cc;
      text-shadow: 0 0 20px rgba(0, 136, 204, 0.5);
    }
    #loading .spinner {
      width: 48px;
      height: 48px;
      border: 3px solid rgba(0, 136, 204, 0.3);
      border-top-color: #0088cc;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 0 auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    #hud {
      position: absolute;
      top: 12px;
      left: 12px;
      font-size: 13px;
      z-index: 10;
      opacity: 0.7;
      pointer-events: none;
    }
    #hud .hud-item {
      padding: 3px 8px;
      background: rgba(0,0,0,0.5);
      border-radius: 4px;
      margin-bottom: 3px;
      backdrop-filter: blur(4px);
    }
    /* Instruction overlay */
    #instruction {
      position: absolute;
      bottom: 60px;
      left: 50%;
      transform: translateX(-50%);
      text-align: center;
      z-index: 10;
      pointer-events: none;
      transition: opacity 0.5s;
    }
    #instruction p {
      font-size: 16px;
      padding: 8px 20px;
      background: rgba(0,0,0,0.6);
      border-radius: 20px;
      backdrop-filter: blur(8px);
      border: 1px solid rgba(0, 136, 204, 0.3);
      text-shadow: 0 0 8px rgba(0, 136, 204, 0.4);
    }
    .hidden { display: none !important; }
  </style>
</head>
<body>
  <div id="app">
    <video id="camera-feed" autoplay playsinline></video>
    <canvas id="three-canvas"></canvas>
    <canvas id="hand-overlay"></canvas>
    <div id="hud">
      <div class="hud-item" id="fps-display">FPS: --</div>
      <div class="hud-item" id="gesture-display">대기 중</div>
    </div>
    <div id="instruction">
      <p>양손을 모으고 펼쳐 옥문강을 소환하세요</p>
    </div>
    <div id="loading">
      <h2>獄門疆</h2>
      <div class="spinner"></div>
      <p style="margin-top: 12px; opacity: 0.6;">Loading...</p>
    </div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
