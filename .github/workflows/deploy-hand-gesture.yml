name: Deploy Hand Gesture 3D to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'hand-gesture-3d/**'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: hand-gesture-3d
        run: npm ci

      - name: Build
        working-directory: hand-gesture-3d
        run: npx vite build

      - name: Prepare Pages artifact
        run: |
          mkdir -p _site/hand-gesture-3d
          cp -r hand-gesture-3d/dist/* _site/hand-gesture-3d/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}hand-gesture-3d/
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
